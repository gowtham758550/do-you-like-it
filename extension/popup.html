<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Do You Like It?</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #222; background: #fffaf8; }
    header { padding: 14px 16px 10px; }
    h1 { margin: 0; font-size: 17px; }
    h1 span { color: #e0533d; }
    .tagline { margin: 2px 0 0; color: #777; font-size: 12px; }
    .toggle {
      margin: 0 16px 12px; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between; background: #fff; cursor: pointer;
      font-weight: 600; color: #555;
    }
    .toggle.on { border-color: #f3c4bb; color: #e0533d; background: #fff6f4; }
    .switch { width: 38px; height: 22px; border-radius: 999px; background: #ccc; position: relative; transition: background .15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
    .toggle.on .switch { background: #e0533d; }
    .toggle.on .switch::after { left: 19px; }
    .hint { margin: -6px 16px 12px; color: #999; font-size: 11px; }
    .picks-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-top: 1px solid #f0e4e0; }
    .picks-head h2 { margin: 0; font-size: 14px; }
    button.link { border: 0; background: none; color: #e0533d; font: inherit; font-weight: 600; cursor: pointer; padding: 4px; }
    ul { list-style: none; margin: 0; padding: 0 8px 8px; max-height: 340px; overflow-y: auto; }
    li { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
    li:hover { background: #fff; }
    li img { width: 48px; height: 48px; object-fit: contain; background: #fff; border-radius: 8px; }
    li a { color: #222; text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    li a:hover { color: #e0533d; }
    .price { font-weight: 700; margin-top: 2px; }
    .price.hidden { color: transparent; background: repeating-linear-gradient(135deg, #f4d9de 0 6px, #fbeef0 6px 12px); border-radius: 4px; width: 64px; user-select: none; }
    .remove { border: 0; background: none; color: #bbb; font-size: 16px; cursor: pointer; }
    .remove:hover { color: #e0533d; }
    .empty { padding: 16px; color: #888; text-align: center; }
    footer { padding: 10px 16px 14px; border-top: 1px solid #f0e4e0; display: flex; justify-content: space-between; font-weight: 600; }
    footer[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Do you like it? <span>❤️</span></h1>
    <p class="tagline">Let them choose with their heart. The price is your problem.</p>
  </header>

  <div class="toggle" id="toggle" role="switch" tabindex="0">
    <span id="toggle-label">Prices hidden</span>
    <span class="switch"></span>
  </div>
  <p class="hint">Shortcut: Alt+Shift+P</p>

  <div class="picks-head">
    <h2 id="picks-title">Their picks</h2>
    <button class="link" id="reveal">Show prices</button>
  </div>
  <ul id="picks"></ul>
  <footer id="total" hidden><span>Total</span><span id="total-value"></span></footer>

  <script src="popup.js"></script>
</body>
</html>
