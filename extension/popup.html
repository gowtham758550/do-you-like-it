<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Do You Like It?</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #222; background: #fffaf8; }
    header { padding: 14px 16px 10px; }
    h1 { margin: 0; font-size: 17px; }
    h1 span { color: #e0533d; }
    .tagline { margin: 2px 0 0; color: #777; font-size: 12px; }
    .toggle {
      margin: 0 16px 12px; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between; background: #fff; cursor: pointer;
      font-weight: 600; color: #555;
    }
    .toggle.on { border-color: #f3c4bb; color: #e0533d; background: #fff6f4; }
    .switch { width: 38px; height: 22px; border-radius: 999px; background: #ccc; position: relative; transition: background .15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
    .toggle.on .switch { background: #e0533d; }
    .toggle.on .switch::after { left: 19px; }
    .hint { margin: -6px 16px 12px; color: #999; font-size: 11px; }
    .site-banner { margin: 0 16px 12px; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1.5px dashed #f3c4bb; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .site-banner[hidden] { display: none; }
    .site-banner button { border: 0; border-radius: 999px; background: #e0533d; color: #fff; font: inherit; font-weight: 600; padding: 6px 12px; cursor: pointer; }
    .picks-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-top: 1px solid #f0e4e0; }
    .picks-head h2 { margin: 0; font-size: 14px; }
    button.link { border: 0; background: none; color: #e0533d; font: inherit; font-weight: 600; cursor: pointer; padding: 4px; }
    button.link:hover { text-decoration: underline; }
    #picks { max-height: 380px; overflow-y: auto; padding: 0 8px 8px; }
    .group { margin-bottom: 6px; border-radius: 12px; background: #fff; border: 1px solid #f3e6e2; }
    .group-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 6px 4px; }
    .group-toggle { display: flex; align-items: center; gap: 6px; border: 0; background: none; font: inherit; font-weight: 700; color: #222; cursor: pointer; padding: 4px; }
    .chevron { display: inline-block; width: 14px; color: #999; transition: transform .15s; }
    .collapsed .chevron { transform: rotate(-90deg); }
    .count { font-weight: 600; font-size: 11px; color: #e0533d; background: #fff1ed; border-radius: 999px; padding: 1px 7px; }
    .subtotal { font-weight: 700; }
    .group ul { list-style: none; margin: 0; padding: 0 4px; }
    .group-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 2px 10px 8px; }
    .collapsed ul, .collapsed .group-actions { display: none; }
    li.pick { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px; border-radius: 10px; }
    li.pick:hover { background: #fffaf8; }
    li.pick img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 8px; }
    li.pick a { color: #222; text-decoration: none; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    li.pick a:hover { color: #e0533d; }
    .price { font-weight: 700; margin-top: 2px; }
    .hidden { color: transparent !important; background: repeating-linear-gradient(135deg, #f4d9de 0 6px, #fbeef0 6px 12px); border-radius: 4px; user-select: none; }
    .price.hidden { width: 64px; }
    .subtotal.hidden { display: inline-block; width: 64px; overflow: hidden; white-space: nowrap; }
    .remove { border: 0; background: none; color: #bbb; font-size: 16px; cursor: pointer; }
    .remove:hover { color: #e0533d; }
    .empty { margin: 4px 8px 12px; padding: 20px 16px; color: #888; text-align: center; background: #fff; border-radius: 12px; border: 1px dashed #eadbd6; }
    footer { padding: 10px 16px 14px; border-top: 1px solid #f0e4e0; display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    footer span:last-child { text-align: right; }
    footer[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Do you like it? <span>❤️</span></h1>
    <p class="tagline">Let them choose with their heart. The price is your problem.</p>
  </header>

  <div class="toggle" id="toggle" role="switch" tabindex="0">
    <span id="toggle-label">Prices hidden</span>
    <span class="switch"></span>
  </div>
  <p class="hint">Shortcut: Alt+Shift+P</p>

  <div class="site-banner" id="site-banner" hidden>
    <span id="site-banner-text"></span>
    <button id="site-banner-btn">Turn on</button>
  </div>

  <div class="picks-head">
    <h2 id="picks-title">Their picks</h2>
    <button class="link" id="reveal">Show prices</button>
  </div>
  <div id="picks"></div>
  <footer id="total" hidden><span>Total</span><span id="total-value"></span></footer>

  <script src="currency.js"></script>
  <script src="popup.js"></script>
</body>
</html>
